<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#15344a">
  <title>Solicitação recebida | ObraQuote</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <style>
    .thanks-content{max-width:760px;margin:7vh auto;text-align:center;background:white;border:1px solid #dfe8e9;border-radius:22px;padding:clamp(30px,6vw,65px);box-shadow:0 18px 50px rgba(17,50,68,.08)}
    .thanks-icon{display:inline-flex;align-items:center;justify-content:center;width:66px;height:66px;border-radius:50%;background:#e2f5ef;color:#16795f;font-size:32px;font-weight:bold;margin-bottom:22px}
    .thanks-content h1{color:#15344a;font-size:clamp(2rem,4vw,3rem);margin:15px 0 16px}
    .thanks-content p{font-size:16px;line-height:1.8;margin-bottom:26px}
  </style>
</head>
<body>
  <header class="site-header"><div class="container header-row">
    <a class="brand" href="/" aria-label="ObraQuote, página inicial"><span class="brand-symbol" aria-hidden="true">O<span>Q</span></span><span>Obra<span class="brand-teal">Quote</span></span></a>
  </div></header>
  <main class="container"><section class="thanks-content">
    <span class="thanks-icon" aria-hidden="true">✓</span>
    <div class="kicker">TESTE PILOTO OBRAQUOTE</div>
    <h1>Sua solicitação foi enviada!</h1>
    <p>Obrigado pelo interesse no ObraQuote. Recebemos seu pedido de demonstração. Nossa equipe poderá responder pelo e-mail informado.</p>
    <a class="btn btn-primary" href="/">Voltar ao site do ObraQuote</a>
  </section></main>
</body>
</html>
