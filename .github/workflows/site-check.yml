name: Validar site
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar HTML, links, arquivos e contato
        run: python -m unittest discover -s tests -v
      - name: Verificar JavaScript
        run: |
          node --check public/site-config.js
          node --check public/script.js
